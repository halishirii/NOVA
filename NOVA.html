<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>NOVA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600&display=swap">
<style>
/* Layout: sticky top bar, list on the start side, profile beside it; on phones the profile slides over the list. */
:root{
  --bg:#f5f6f7; --surface:#ffffff; --fg:#15191d; --muted:#67737e; --line:#e1e5e8;
  --accent:#0e6b66; --accent-fg:#ffffff; --soft:#e8f1f0;
  --warn:#8a5200; --warn-bg:#fbf1dc; --danger:#b3261e;
  --font:'Vazirmatn',Tahoma,system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1214; --surface:#171b1e; --fg:#e8ecef; --muted:#8b97a2; --line:#262c31;
  --accent:#4cc2b8; --accent-fg:#06201e; --soft:#15302e;
  --warn:#e8b45a; --warn-bg:#2b2310; --danger:#f2867f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1214; --surface:#171b1e; --fg:#e8ecef; --muted:#8b97a2; --line:#262c31;
  --accent:#4cc2b8; --accent-fg:#06201e; --soft:#15302e;
  --warn:#e8b45a; --warn-bg:#2b2310; --danger:#f2867f; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:auto}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.wrap{max-width:1120px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-block:12px 10px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.brand{display:flex;align-items:center;gap:10px;font-weight:300;letter-spacing:.42em;font-size:18px;direction:ltr;margin-inline-end:6px}
.logo{width:36px;height:36px;border-radius:9px;object-fit:cover;flex:none;background:#000}
.tabs{display:flex;gap:2px}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:6px 12px;color:var(--muted);font-weight:500;min-height:40px}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab small{color:var(--muted);font-weight:400;margin-inline-start:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-inline-start:auto}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 14px;min-height:40px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.small{min-height:32px;padding:2px 10px;font-size:13px}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.notice{margin-top:12px;padding:8px 12px;border-radius:8px;background:var(--warn-bg);color:var(--warn);font-size:13px}
.main{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:24px;padding-block:18px 60px;align-items:start}
.listcol{min-width:0}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;min-height:42px}
.count{color:var(--muted);font-size:13px;margin:10px 2px 6px}
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.item{display:block;width:100%;text-align:start;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 6px;min-width:0}
.item:hover{background:var(--surface)}
.item[aria-current="true"]{background:var(--surface);box-shadow:inset 3px 0 0 var(--accent)}
.item .nm{font-weight:500;display:flex;gap:8px;align-items:center;min-width:0}
.item .nm span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sub{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none}
.empty{border:1px dashed var(--line);border-radius:12px;padding:28px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:14px}
.empty b{color:var(--fg);font-weight:500}

.profile{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
.ph{color:var(--muted);text-align:center;padding:60px 10px}
.pbar{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.pbar h2{font-size:19px;font-weight:600;margin:0;flex:1;min-width:0;overflow-wrap:anywhere;text-wrap:balance}
.back{display:none}
.badge{font-size:12px;border-radius:999px;padding:1px 10px;background:var(--soft);color:var(--accent);white-space:nowrap}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.banner a{color:inherit}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
.f label,.lbl{font-size:13px;color:var(--muted)}
.f input,.f textarea,.f select,.sheetbox textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;min-height:42px;resize:vertical}
.inline{display:flex;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--bg);overflow:hidden;min-height:32px}
.chip button{background:none;border:0;padding:2px 10px;min-height:30px}
.chip .x{color:var(--muted);padding:2px 9px;border-inline-start:1px solid var(--line)}
.foot{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.foot .sp{margin-inline-start:auto}

.overlay{position:fixed;inset:0;background:rgba(10,14,16,.5);z-index:40;display:flex;align-items:flex-start;justify-content:center;overflow:auto;
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(12px,env(safe-area-inset-left,0px)) 24px max(12px,env(safe-area-inset-right,0px))}
.sheetbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:100%;max-width:640px;padding:20px;display:flex;flex-direction:column;gap:14px}
.sheetbox h2{margin:0;font-size:18px;font-weight:600;flex:1}
.shead{display:flex;align-items:center;gap:10px}
.hint{font-size:13px;color:var(--muted)}
.hint a{color:var(--accent)}
.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.res{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.rit{display:flex;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);align-items:flex-start;min-width:0}
.rit input{margin-top:6px;flex:none;width:18px;height:18px}
.rit .b{min-width:0;flex:1}
.rit .nm{font-weight:500;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rit .d{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.err{color:var(--danger);font-size:13px}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;z-index:60;max-width:calc(100% - 32px);text-align:center}

.filebtn{position:relative;display:inline-flex;align-items:center;overflow:hidden}
.filebtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.mapbox{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:10px;padding:12px}
.maprid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inl{display:flex;gap:8px;align-items:center}
.inl input{width:18px;height:18px}
.notice.ok{background:var(--soft);color:var(--accent)}
.notice button{margin-inline-start:10px}
@media (max-width:899px){
  .main{grid-template-columns:minmax(0,1fr)}
  .profile{display:none}
  .main.open .profile{display:block;position:fixed;inset:0;z-index:35;border-radius:0;border:0;overflow:auto;
    padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 28px) max(16px,env(safe-area-inset-left,0px))}
  .back{display:inline-flex}
  .ph{display:none}
}
@media (max-width:560px){.form,.maprid{grid-template-columns:1fr}.actions{margin-inline-start:0;width:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

      <input class="search" id="q" type="search" placeholder="جستجو در آرشیو" autocomplete="off" dir="auto">

<div id="toast" role="status" aria-live="polite" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
document.documentElement.dir='rtl';document.documentElement.lang='fa';

const $=s=>document.querySelector(s);
function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(v==null||v===false)continue;
    if(k==='class')e.className=v;
    else if(k==='text')e.textContent=v;
    else if(k==='value')e.value=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else if(v===true)e.setAttribute(k,'');
    else e.setAttribute(k,v);
  }
  for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c));}
  return e;
}
const norm=s=>String(s==null?'':s).replace(/[يى]/g,'ی').replace(/ك/g,'ک').replace(/[‌‏‎]/g,' ')
  .replace(/^(دکتر|dr\.?)\s+/i,'').replace(/\s+/g,' ').trim().toLowerCase();
const fa=new Intl.Collator('fa');
const jalaliToday=()=>new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const clone=o=>JSON.parse(JSON.stringify(o));

const S={doctors:new Map(),pharmacies:new Map(),tab:'doctors',sel:null,W:null,dirty:false,q:'',limit:200,
  db:null,sample:null,dl:null,ro:false,loaded:{doctors:false,pharmacies:false},slow:false,discard:false};
const Q={run:0,max:4,q:[]};
const lastW=new Map();
function runJob(fn){return new Promise(res=>{Q.q.push({fn,res});pump();});}
function pump(){
  while(Q.run<Q.max&&Q.q.length){
    const j=Q.q.shift();Q.run++;
    (async()=>{
      let ok=false;
      for(let a=0;a<4&&!ok;a++){
        try{await j.fn();ok=true;}
        catch(e){const c=e&&e.code;if(c==='quota_exceeded'||c==='invalid_argument'||c==='revoked')break;if(c==='resource_exhausted')Q.max=Math.max(1,Q.max-1);await new Promise(r=>setTimeout(r,800*(a+1)));}
      }
      Q.run--;j.res(ok);pump();
    })();
  }
}
function docWrite(key,fn){
  const prev=lastW.get(key)||Promise.resolve(true);
  const p=prev.then(()=>runJob(fn));
  lastW.set(key,p);
  p.then(()=>{if(lastW.get(key)===p)lastW.delete(key);});
  return p;
}
let rt;
function sched(){clearTimeout(rt);rt=setTimeout(()=>{renderTop();renderList();renderNotices();if(!S.dirty)renderProfile();},200);}

const FIELDS={
  doctors:[['name','نام و نام خانوادگی','input','full'],['nezamCode','کد نظام پزشکی','input'],['specialty','تخصص','input'],
    ['phone','شماره تلفن','input'],['address','آدرس مطب','area','full'],['workHours','روزها و ساعت کاری مطب','area','full'],
    ['traits','ویژگی شخصیتی','area','full'],['lastVisitDate','تاریخ آخرین ویزیت','date'],['lastVisit','خلاصه آخرین ویزیت','area','full']],
  pharmacies:[['name','نام داروخانه','input','full'],['buyer','مسئول خرید','input'],['phone','شماره تلفن','input'],
    ['address','آدرس','area','full'],['lastVisitDate','تاریخ آخرین ویزیت','date'],['lastVisit','خلاصه آخرین ویزیت','area','full']]
};
const TITLE={doctors:'پزشکان',pharmacies:'داروخانه‌ها'};
const ONE={doctors:'پزشک',pharmacies:'داروخانه'};

/* ---------- toast ---------- */
let tt;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{t.hidden=true},3600);}

/* ---------- storage ---------- */
function newId(col){return S.db?S.db.collection(col).doc().id:'l'+Math.random().toString(36).slice(2,10);}
function persist(col,id,data,quiet){
  const rec=Object.assign({},data);delete rec.id;
  S[col].set(id,Object.assign({},rec,{id}));
  if(!S.db)return Promise.resolve(true);
  return docWrite(col+'/'+id,()=>S.db.collection(col).doc(id).set(rec)).then(ok=>{if(!ok&&!quiet)toast('ذخیره‌ی «'+(rec.name||'')+'» انجام نشد');return ok;});
}
function removeRec(col,id){
  S[col].delete(id);
  if(S.db)docWrite(col+'/'+id,()=>S.db.collection(col).doc(id).delete()).then(ok=>{if(!ok)toast('حذف انجام نشد');});
}
function subscribe(){
  setTimeout(()=>{if(!S.loaded.doctors||!S.loaded.pharmacies){S.slow=true;renderNotices();}},10000);
  for(const col of ['doctors','pharmacies']){
    S.db.collection(col).onSnapshot(snap=>{
      S[col]=new Map(snap.docs.map(d=>[d.id,Object.assign({},d.data(),{id:d.id})]));
      if(!snap.metadata.fromCache||snap.size>0)S.loaded[col]=true;
      if(S.loaded.doctors&&S.loaded.pharmacies)S.slow=false;
      sched();checkSeed();
    },()=>{S.slow=true;renderNotices();});
  }
}

/* ---------- navigation ---------- */
function go(fn){
  if(S.dirty&&!S.discard){S.discard=true;toast('تغییرات ذخیره‌نشده دارید. برای رها کردن، دوباره بزنید.');setTimeout(()=>{S.discard=false},4000);return;}
  S.discard=false;fn();
}
function seedW(){
  const {col,id}=S.sel;const rec=S[col].get(id);if(!rec){S.W=null;return;}
  S.W=clone(rec);
  if(col==='pharmacies')S.W.doctorIds=[...S.doctors.values()].filter(d=>(d.pharmacyIds||[]).includes(id)).map(d=>d.id);
}
function openRec(col,id){go(()=>{S.tab=col;S.sel={col,id};S.dirty=false;seedW();render();window.scrollTo(0,0);});}
function closeProfile(){go(()=>{S.sel=null;S.W=null;S.dirty=false;render();});}
function addBlank(){
  go(()=>{const col=S.tab,id=newId(col);
    S.W=col==='doctors'?{name:'',nezamCode:'',specialty:'',phone:'',address:'',workHours:'',traits:'',lastVisitDate:'',lastVisit:'',pharmacyIds:[],status:'manual'}
      :{name:'',buyer:'',phone:'',address:'',lastVisitDate:'',lastVisit:'',doctorIds:[]};
    S.sel={col,id,isNew:true};S.dirty=true;render();});
}

/* ---------- render: top ---------- */
function renderTop(){
  const tabs=$('#tabs');tabs.replaceChildren();
  for(const col of ['doctors','pharmacies']){
    tabs.append(h('button',{class:'tab',role:'tab','aria-selected':String(S.tab===col),
      onclick:()=>{if(S.tab!==col)go(()=>{S.tab=col;S.sel=null;S.W=null;S.dirty=false;S.q='';S.limit=200;$('#q').value='';render();});}},
      TITLE[col],h('small',{text:String(S[col].size)})));
  }
  const a=$('#actions');a.replaceChildren();
  if(!S.ro){
    a.append(h('button',{class:'btn primary',onclick:openSheet},'+ افزودن'));
    a.append(h('button',{class:'btn',onclick:openSheet},'ورود از فایل'));
  }
  const dlOk=!!S.dl;
  a.append(h('button',{class:'btn',disabled:!dlOk,title:dlOk?'':'ذخیره‌ی فایل در این نمایش در دسترس نیست',onclick:exportXlsx},'خروجی اکسل'));
  a.append(h('button',{class:'btn',disabled:!dlOk,onclick:exportCsv},'CSV'));
}
function renderNotices(){
  const n=$('#notices');n.replaceChildren();
  if(!S.db&&S.dbChecked)n.append(h('div',{class:'notice',text:'ذخیره‌سازی دائمی در این نمایش فعال نیست. تغییرات فقط تا بستن صفحه می‌مانند.'}));
  else if(S.slow)n.append(h('div',{class:'notice',text:'اتصال به آرشیو برقرار نشد. داده‌های نمایش‌داده‌شده ممکن است قدیمی باشند.'}));
  if(S.ro)n.append(h('div',{class:'notice',text:'دسترسی شما فقط برای مشاهده است.'}));
  if(S.seeding)n.append(h('div',{class:'notice ok',text:'در حال ساخت آرشیو اولیه‌ی تهران: '+S.seedDone+' از '+S.seedTotal+'. صفحه را تا پایان باز نگه دارید.'}));
  else if(S.seedOffer&&!S.ro&&S.db)n.append(h('div',{class:'notice ok'},'آرشیو اولیه‌ی تهران ('+MASTER.length+' پزشک) هنوز کامل وارد نشده است.',
    h('button',{class:'btn small',onclick:()=>{S.seedOffer=false;seedMaster();}},'افزودن موارد جاافتاده')));
}

/* ---------- render: list ---------- */
function matches(r,q){if(!q)return true;const t=norm(q);return Object.values(r).some(v=>typeof v==='string'&&norm(v).includes(t));}
function renderList(){
  const col=S.tab,all=[...S[col].values()].sort((a,b)=>fa.compare(a.name||'',b.name||''));
  const rows=all.filter(r=>matches(r,S.q));
  $('#count').textContent=(S.db&&!(S.loaded.doctors&&S.loaded.pharmacies))?'در حال بارگذاری…':
    (S.q?rows.length+' از '+all.length:all.length)+' '+ONE[col];
  const list=$('#list');list.replaceChildren();
  if(!all.length&&(S.loaded[col]||!S.db)){
    list.append(h('div',{class:'empty'},h('div',{},h('b',{text:col==='doctors'?'هنوز پزشکی در آرشیو نیست':'هنوز داروخانه‌ای در آرشیو نیست'}),h('br'),
      col==='doctors'?'نام‌ها را وارد کنید یا فایل اکسل بدهید تا پروفایل ساخته شود.':'نام‌ها را وارد کنید یا فایل اکسل بدهید.'),
      S.ro?null:h('button',{class:'btn primary',onclick:openSheet},'افزودن '+ONE[col])));
    return;
  }
  for(const r of rows.slice(0,S.limit)){
    let sub;
    if(col==='doctors')sub=[r.specialty,r.nezamCode&&('کد '+r.nezamCode)].filter(Boolean).join(' · ');
    else{const n=[...S.doctors.values()].filter(d=>(d.pharmacyIds||[]).includes(r.id)).length;sub=[r.buyer,n?n+' پزشک':''].filter(Boolean).join(' · ');}
    list.append(h('button',{class:'item','aria-current':String(!!S.sel&&S.sel.id===r.id),onclick:()=>openRec(col,r.id)},
      h('div',{class:'nm'},h('span',{text:r.name||'بدون نام'}),r.status==='ai'?h('span',{class:'dot',title:'اطلاعات تأییدنشده'}):null),
      h('div',{class:'sub',text:sub||'—'})));
  }
  if(!rows.length)list.append(h('div',{class:'ph',text:'موردی پیدا نشد.'}));
  else if(rows.length>S.limit)list.append(h('button',{class:'btn',style:'margin-top:12px',onclick:()=>{S.limit+=400;renderList();}},'نمایش بیشتر ('+(rows.length-S.limit)+' مورد دیگر)'));
}

/* ---------- render: profile ---------- */
function markDirty(){S.dirty=true;const b=$('#saveBtn');if(b)b.disabled=false;}
function fieldEl(key,label,kind,full){
  const id='f-'+key;
  const inp=kind==='area'?h('textarea',{id,rows:3,dir:'auto'}):h('input',{id,type:'text',dir:'auto',autocomplete:'off'});
  inp.value=S.W[key]||'';inp.disabled=S.ro;
  inp.addEventListener('input',()=>{S.W[key]=inp.value;markDirty();});
  let ctl=inp;
  if(kind==='date'&&!S.ro)ctl=h('div',{class:'inline'},inp,h('button',{class:'btn small',type:'button',onclick:()=>{inp.value=jalaliToday();S.W[key]=inp.value;markDirty();}},'امروز'));
  return h('div',{class:'f'+(full?' full':'')},h('label',{for:id,text:label}),ctl);
}
function linkPicker(label,srcMap,key,openCol){
  const box=h('div',{class:'f full'});
  const draw=()=>{
    box.replaceChildren(h('span',{class:'lbl',text:label}));
    const ids=S.W[key]||[];
    const chips=h('div',{class:'chips'});
    for(const id of ids){const r=srcMap.get(id);if(!r)continue;
      chips.append(h('span',{class:'chip'},h('button',{type:'button',onclick:()=>openRec(openCol,id)},r.name),
        S.ro?null:h('button',{type:'button',class:'x','aria-label':'حذف پیوند',onclick:()=>{S.W[key]=ids.filter(x=>x!==id);markDirty();draw();}},'×')));}
    if(chips.childNodes.length)box.append(chips);
    const rest=[...srcMap.values()].filter(r=>!ids.includes(r.id)).sort((a,b)=>fa.compare(a.name||'',b.name||''));
    if(!S.ro&&rest.length){
      const sel=h('select',{'aria-label':label},h('option',{value:'',text:'افزودن…'}),rest.map(r=>h('option',{value:r.id,text:r.name})));
      sel.addEventListener('change',()=>{if(sel.value){S.W[key]=[...ids,sel.value];markDirty();draw();}});
      box.append(sel);
    }else if(!ids.length)box.append(h('div',{class:'hint',text:'موردی برای پیوند وجود ندارد.'}));
  };
  draw();return box;
}
function renderProfile(){
  const p=$('#profile'),main=$('#main');p.replaceChildren();
  if(S.sel&&!S.sel.isNew&&!S.dirty)seedW();
  if(!S.sel||!S.W){main.classList.remove('open');p.append(h('div',{class:'ph',text:'یک مورد را از فهرست انتخاب کنید.'}));return;}
  main.classList.add('open');
  const col=S.sel.col;
  p.append(h('div',{class:'pbar'},
    h('button',{class:'btn small back',onclick:closeProfile,'aria-label':'بازگشت'},'‹ فهرست'),
    h('h2',{text:S.W.name||('+ '+ONE[col]+' جدید')}),
    col==='doctors'&&S.W.status==='verified'?h('span',{class:'badge',text:'تأییدشده'}):null));
  if(col==='doctors'&&S.W.status==='ai'){
    p.append(h('div',{class:'banner'},h('div',{},'بخشی از این اطلاعات پیشنهاد هوش مصنوعی است و تأیید نشده. کد نظام پزشکی را در سایت رسمی ',
      h('a',{href:'https://www.irimc.org',target:'_blank',rel:'noopener',text:'نظام پزشکی'}),' تطبیق دهید.'),
      S.ro?null:h('button',{class:'btn small',onclick:()=>{S.W.status='verified';markDirty();renderProfile();}},'تطبیق دادم')));
  }
  const form=h('div',{class:'form'});
  for(const [k,l,kind,full] of FIELDS[col])form.append(fieldEl(k,l,kind,full));
  if(col==='doctors')form.append(linkPicker('داروخانه‌های مرتبط',S.pharmacies,'pharmacyIds','pharmacies'));
  else form.append(linkPicker('پزشکان مرتبط',S.doctors,'doctorIds','doctors'));
  p.append(form);
  if(!S.ro){
    const foot=h('div',{class:'foot'});
    foot.append(h('button',{id:'saveBtn',class:'btn primary',disabled:!S.dirty,onclick:saveProfile},'ذخیره'));
    if(col==='doctors'&&S.sample)foot.append(h('button',{class:'btn',onclick:fillOnline,id:'fillBtn'},'تکمیل با جستجو'));
    if(!S.sel.isNew){
      const del=h('button',{class:'btn danger sp'},'حذف');
      let armed=false;
      del.addEventListener('click',()=>{
        if(!armed){armed=true;del.textContent='تأیید حذف؟';setTimeout(()=>{armed=false;del.textContent='حذف';},4000);return;}
        deleteCurrent();
      });
      foot.append(del);
    }
    p.append(foot);
  }
}
function saveProfile(){
  const col=S.sel.col,id=S.sel.id;
  if(!(S.W.name||'').trim()){toast('نام را وارد کنید');return;}
  const now=Date.now(),W=clone(S.W);
  if(col==='doctors'){
    W.updatedAt=now;if(!W.createdAt)W.createdAt=now;persist('doctors',id,W);
  }else{
    const ids=W.doctorIds||[];delete W.doctorIds;W.updatedAt=now;if(!W.createdAt)W.createdAt=now;persist('pharmacies',id,W);
    for(const d of [...S.doctors.values()]){
      const has=(d.pharmacyIds||[]).includes(id),want=ids.includes(d.id);
      if(has!==want){
        const nx=want?[...(d.pharmacyIds||[]),id]:(d.pharmacyIds||[]).filter(x=>x!==id);
        persist('doctors',d.id,Object.assign({},d,{pharmacyIds:nx,updatedAt:now}));
      }
    }
  }
  S.sel.isNew=false;S.dirty=false;seedW();render();toast('ذخیره شد');
}
function deleteCurrent(){
  const {col,id}=S.sel;
  if(col==='pharmacies'){
    for(const d of [...S.doctors.values()])if((d.pharmacyIds||[]).includes(id))
      persist('doctors',d.id,Object.assign({},d,{pharmacyIds:d.pharmacyIds.filter(x=>x!==id),updatedAt:Date.now()}));
  }
  removeRec(col,id);S.sel=null;S.W=null;S.dirty=false;render();toast('حذف شد');
}

/* ---------- online lookup (AI-assisted, unverified) ---------- */
function lookupPrompt(names){
  return 'You help a pharmaceutical sales representative in Iran keep an archive of physicians. For each physician name below, report only what you reliably know from general knowledge. You cannot browse the web. NEVER invent or guess a medical council number (کد نظام پزشکی), phone number or street address: use an empty string whenever you are not sure. Names are often shared by many people, so use confidence "none" if you cannot tell who is meant. Write specialty in Persian. workHours is the typical clinic days/hours, only if known.\n\n'
   +'Reply with only a JSON array, same order and same length as the input, of objects like {"name": string (exactly as given), "nezamCode": string, "specialty": string, "address": string, "workHours": string, "confidence": "high"|"low"|"none"}.\n\nNames:\n'
   +names.map((n,i)=>(i+1)+'. '+n).join('\n');
}
function cleanFound(r){
  const o={nezamCode:'',specialty:'',address:'',workHours:'',confidence:'none'};
  if(!r||typeof r!=='object')return o;
  for(const k of ['nezamCode','specialty','address','workHours'])if(typeof r[k]==='string'||typeof r[k]==='number')o[k]=String(r[k]).trim();
  if(['high','low','none'].includes(r.confidence))o.confidence=r.confidence;
  if(o.confidence==='none')return Object.assign(o,{nezamCode:'',address:'',workHours:''});
  return o;
}
function sampleMsg(e){
  const c=e&&e.code;
  if(c==='not_granted')return 'اجازه‌ی استفاده از Claude داده نشد.';
  if(c==='rate_limited')return 'تعداد درخواست‌ها زیاد است. کمی بعد دوباره تلاش کنید.';
  if(c==='invalid_json')return 'پاسخ قابل خواندن نبود. دوباره تلاش کنید.';
  if(c==='cancelled')return '';
  return 'جستجو انجام نشد. دوباره تلاش کنید.';
}
async function lookupNames(names){
  const res=await S.sample.json(lookupPrompt(names),{modelTier:'default'});
  const arr=Array.isArray(res)?res:[];
  return names.map((n,i)=>{
    const byIdx=arr[i]&&norm(arr[i].name)===norm(n)?arr[i]:null;
    const byName=arr.find(x=>x&&norm(x.name)===norm(n));
    return cleanFound(byIdx||byName||null);
  });
}
async function fillOnline(){
  const btn=$('#fillBtn');if(!S.W.name.trim()){toast('ابتدا نام را وارد کنید');return;}
  btn.disabled=true;btn.textContent='در حال جستجو…';
  try{
    const [f]=await lookupNames([S.W.name]);let used=false;
    for(const k of ['nezamCode','specialty','address','workHours'])if(!(S.W[k]||'').trim()&&f[k]){S.W[k]=f[k];used=true;}
    if(used){S.W.status='ai';markDirty();renderProfile();toast('فیلدهای خالی پیشنهاد شد؛ لطفاً بررسی کنید');}
    else{btn.disabled=false;btn.textContent='تکمیل با جستجو';toast('اطلاعات قابل اتکایی پیدا نشد');}
  }catch(e){btn.disabled=false;btn.textContent='تکمیل با جستجو';const m=sampleMsg(e);if(m)toast(m);}
}

/* ---------- add sheet / import ---------- */
const A={kind:'doctors',names:'',items:[],busy:false,msg:'',err:''};
const RULES={
  doctors:[['status',/وضعیت|status/],['skip',/zone|منطقه|province|استان|city|شهر|header|detail/],
    ['nezamCode',/نظام|nezam|council|کد|code/],['specialty',/تخصص|special/],['address',/آدرس|نشانی|address/],
    ['workHours',/ساعت|روز|hours|day/],['traits',/ویژگی|شخصیت|trait/],['skip',/داروخانه|pharm/],['phone',/تلفن|موبایل|phone|tel|mobile/],
    ['lastVisitDate',/تاریخ|date/],['lastVisit',/ویزیت|خلاصه|visit/],['name',/نام|اسم|پزشک|دکتر|name|doctor|physician/]],
  pharmacies:[['skip',/zone|منطقه|province|استان|city|شهر|header|detail/],['buyer',/مسئول|خرید|buyer/],['address',/آدرس|نشانی|address/],
    ['phone',/تلفن|موبایل|phone|tel|mobile/],['lastVisitDate',/تاریخ|date/],['lastVisit',/ویزیت|خلاصه|visit/],
    ['skip',/پزشک|doctor/],['name',/نام|اسم|داروخانه|name|pharm/]]
};
function parseCSV(t){
  const rows=[];let r=[],c='',q=false;t=t.replace(/^﻿/,'');
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++;}else q=false;}else c+=ch;}
    else if(ch==='"')q=true;
    else if(ch===','||ch==='؛'||ch===';'||ch==='\t'){r.push(c);c='';}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);c='';rows.push(r);r=[];}
    else c+=ch;}
  if(c||r.length){r.push(c);rows.push(r);}
  return rows;
}
function detect(rows,kind){
  const map={};
  if(!rows.length)return map;
  rows[0].forEach((hd,i)=>{const t=norm(hd);for(const [k,re] of RULES[kind])if(re.test(t)){if(k!=='skip'&&k!=='status'&&!(k in map))map[k]=i;break;}});
  return map;
}
function looksHeader(rows,kind){const m=detect(rows,kind);const n=Object.keys(m).length;return n>0&&('name' in m||n>1);}
function remap(){
  A.map=A.hasHeader?detect(A.raw,A.kind):{};
  if(!('name' in A.map))A.map.name=0;
  applyMap();
}
function setRaw(rows){
  rows=rows.filter(r=>r.some(c=>String(c==null?'':c).trim()));
  A.raw=rows;
  if(!rows.length){A.items=A.items.filter(i=>!i.fromFile);A.err='فایل خالی است.';return;}
  A.hasHeader=looksHeader(rows,A.kind);
  remap();
}
function applyMap(){
  A.items=A.items.filter(i=>!i.fromFile);
  if(!('name' in A.map)){A.err='ستون نام انتخاب نشده است.';return;}
  const have=new Set(A.items.map(i=>norm(i.name)));
  const cell=(r,i)=>String(r[i]==null?'':r[i]).trim();
  let add=0;
  for(const r of A.raw.slice(A.hasHeader?1:0)){
    const name=cell(r,A.map.name);if(!name)continue;
    const k=norm(name);if(have.has(k))continue;have.add(k);
    const known={};
    for(const [f,ci] of Object.entries(A.map)){if(f==='name')continue;const v=cell(r,ci);if(v)known[f]=v;}
    A.items.push({name,known,found:null,include:true,fromFile:true});add++;
  }
  A.err=add?'':'نامی در ستون انتخاب‌شده پیدا نشد.';
}
function mapUI(){
  const wrap=h('div',{class:'mapbox'});
  const hdr=A.raw[0]||[];
  const cols=Math.max(hdr.length,...A.raw.slice(0,30).map(r=>r.length));
  const label=i=>(A.hasHeader&&String(hdr[i]==null?'':hdr[i]).trim())?String(hdr[i]).trim():'ستون '+(i+1);
  const cb=h('input',{type:'checkbox',id:'hasHdr'});cb.checked=A.hasHeader;
  cb.addEventListener('change',()=>{A.hasHeader=cb.checked;remap();renderSheet();});
  wrap.append(h('div',{class:'hint',text:'ستون‌ها را کنترل کنید. هر فیلد از ستونی که انتخاب کنید خوانده می‌شود.'}),

  const grid=h('div',{class:'maprid'});

    sel.value=A.map[k]==null?'':String(A.map[k]);

    grid.append(h('div',{class:'f'},h('span',{class:'lbl',text:l+(k==='name'?' *':'')}),sel));
  }
  wrap.append(grid);

}
async function readFile(file){
  const buf=await file.arrayBuffer();
  if(/\.(csv|tsv|txt)$/i.test(file.name)){
    let text;
    try{text=new TextDecoder('utf-8',{fatal:true}).decode(buf);}catch(e){text=new TextDecoder('windows-1256').decode(buf);}
    return parseCSV(text);
  }
  if(!window.XLSX)throw new Error('xlsx');
  const wb=XLSX.read(buf,{type:'array'});
  return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:false});
}
let EX=null;
function exset(){const m=S[A.kind];if(!EX||EX.kind!==A.kind||EX.n!==m.size)EX={kind:A.kind,n:m.size,set:new Set([...m.values()].map(r=>norm(r.name)))};return EX.set;}
const existing=name=>exset().has(norm(name));
function collect(){
  if(A.names.includes('\t')){
    const rows=A.names.split(/\r?\n/).map(l=>l.split('\t'));
    A.names='';setRaw(rows);return;
  }
  const names=A.names.split(/[\n,،;؛]+/).map(s=>s.trim()).filter(Boolean);
  const have=new Set(A.items.map(i=>norm(i.name)));
  for(const n of names)if(!have.has(norm(n))){have.add(norm(n));A.items.push({name:n,known:{},found:null,include:true});}
  A.names='';
}
function mergeItem(it){
  const data=Object.assign({},it.known);let used=false;
  for(const k of ['nezamCode','specialty','address','workHours'])if(!data[k]&&it.found&&it.found[k]){data[k]=it.found[k];used=true;}
  return {data,used};
}
function openSheet(){
  if(S.ro)return;
  A.kind=S.tab;A.names='';A.items=[];A.busy=false;A.looking=false;A.msg='';A.err='';A.raw=null;A.map={};A.hasHeader=false;
  $('#sheet').hidden=false;renderSheet();
}
function closeSheet(){$('#sheet').hidden=true;}
async function runLookup(){
  collect();
  const todo=A.items.filter(i=>!i.found&&!existing(i.name));
  if(!todo.length){A.err='نامی برای جستجو وجود ندارد.';renderSheet();return;}
  A.busy=true;A.looking=true;A.err='';renderSheet();
  try{
    for(let i=0;i<todo.length;i+=8){
      const part=todo.slice(i,i+8);
      A.msg='در حال جستجو… '+Math.min(i+8,todo.length)+' از '+todo.length;renderSheet();
      const found=await lookupNames(part.map(x=>x.name));
      part.forEach((it,k)=>{it.found=found[k];});
    }
  }catch(e){A.err=sampleMsg(e);}
  A.busy=false;A.looking=false;A.msg='';renderSheet();
}
async function saveItems(){
  collect();
  const doc=A.kind==='doctors',ex=new Set(exset()),now=Date.now(),jobs=[];
  for(const it of A.items){
    const key=norm(it.name);
    it.saved=false;
    if(!it.include||ex.has(key))continue;
    ex.add(key);
    const {data,used}=mergeItem(it),id=newId(A.kind);
    const rec=doc?Object.assign({name:it.name,nezamCode:'',specialty:'',phone:'',address:'',workHours:'',traits:'',lastVisitDate:'',lastVisit:'',pharmacyIds:[],status:used?'ai':'manual',createdAt:now,updatedAt:now},data)
      :Object.assign({name:it.name,buyer:'',phone:'',address:'',lastVisitDate:'',lastVisit:'',createdAt:now,updatedAt:now},data);
    jobs.push([it,id,rec]);
  }
  if(!jobs.length){toast('مورد جدیدی برای ذخیره نبود');return;}
  A.busy=true;A.err='';renderSheet();
  let done=0,bad=0;
  await Promise.all(jobs.map(([it,id,rec])=>persist(A.kind,id,rec,true).then(ok=>{
    it.saved=ok;done++;if(!ok)bad++;
    if(done%10===0||done===jobs.length){const b=$('#btnSave');if(b)b.textContent='در حال ذخیره… '+done+' از '+jobs.length;}
  })));
  A.items=A.items.filter(i=>!i.saved);A.busy=false;
  renderTop();renderList();
  if(!A.items.length)closeSheet();else renderSheet();
  toast(bad?(jobs.length-bad)+' پروفایل ساخته شد، '+bad+' مورد ذخیره نشد':jobs.length+' پروفایل ساخته شد');
}
function renderSheet(){

    }

  });

    h('span',{class:'hint',text:'یا جدول را از اکسل کپی و در کادر بالا پیست کنید.'})));
  if(A.raw&&A.raw.length)box.append(mapUI());
  if(doc&&S.sample)box.append(h('div',{class:'hint'},'جستجو از دانش هوش مصنوعی استفاده می‌کند و به پایگاه رسمی وصل نیست؛ نتیجه‌ها پیش‌نویس‌اند. کد نظام پزشکی را در ',
    h('a',{href:'https://www.irimc.org',target:'_blank',rel:'noopener',text:'سایت نظام پزشکی'}),' تطبیق دهید.'));
  const btns=h('div',{class:'row2'});

  btns.append(h('button',{id:'btnSave',class:'btn'+((doc&&S.sample)?'':' primary'),disabled:A.busy,onclick:saveItems},doc&&S.sample?'ذخیره بدون جستجو':'ذخیره'));
  box.append(btns);
  if(A.err)box.append(h('div',{class:'err',text:A.err}));
  if(A.items.length){
    box.append(h('div',{class:'hint',text:A.items.length+' مورد آماده است'+(A.items.length>60?' (۶۰ مورد اول نمایش داده می‌شود؛ همه ذخیره می‌شوند)':'')}));
    const res=h('div',{class:'res'});
    for(const it of A.items.slice(0,60)){
      const dup=existing(it.name),{data,used}=mergeItem(it);
      const cb=h('input',{type:'checkbox','aria-label':'انتخاب '+it.name,disabled:dup});
      cb.checked=it.include&&!dup;cb.addEventListener('change',()=>{it.include=cb.checked;});
      const detail=[data.specialty,data.nezamCode&&('کد '+data.nezamCode),data.address].filter(Boolean).join(' · ');
      const badge=dup?['قبلاً در آرشیو',true]:used?['پیشنهادی، تأییدنشده',true]:it.found?['بدون نتیجه',false]:Object.keys(it.known).length?['از فایل',false]:null;
      res.append(h('div',{class:'rit'},cb,h('div',{class:'b'},
        h('div',{class:'nm'},h('span',{text:it.name}),badge?h('span',{class:'badge'+(badge[1]?' warn':''),text:badge[0]}):null),

    }
    box.append(res);
  }
}

async function seedMaster(){
  if(S.seeding||S.ro||!S.db)return;
  S.seeding=true;
  const ex=new Set([...S.doctors.values()].map(r=>norm(r.name))),now=Date.now(),jobs=[];
  for(const [name,code,spec,addr] of MASTER){
    const k=norm(name);if(ex.has(k))continue;ex.add(k);
    jobs.push({name,nezamCode:code,specialty:spec,address:addr,phone:'',workHours:'',traits:'',lastVisitDate:'',lastVisit:'',pharmacyIds:[],status:'manual',createdAt:now,updatedAt:now});
  }
  S.seedTotal=jobs.length;S.seedDone=0;renderNotices();
  let bad=0;
  await Promise.all(jobs.map(rec=>persist('doctors',newId('doctors'),rec,true).then(ok=>{
    S.seedDone++;if(!ok)bad++;if(S.seedDone%25===0)renderNotices();
  })));
  S.seeding=false;
  if(!bad){try{await S.db.doc('meta/seed').set({done:true,count:MASTER.length,at:Date.now()});S.seedFlag=true;}catch(e){}}
  else S.seedOffer=true;
  renderTop();renderList();renderNotices();
  toast(bad?(jobs.length-bad)+' پزشک ساخته شد، '+bad+' مورد ذخیره نشد. دوباره امتحان کنید.':'آرشیو اولیه‌ی تهران آماده شد');
}
async function checkSeed(){
  if(S.seedChecked||!S.db||!S.userChecked||S.ro||!S.loaded.doctors||!S.loaded.pharmacies)return;
  S.seedChecked=true;
  try{const f=await S.db.doc('meta/seed').get();S.seedFlag=f.exists;}catch(e){return;}
  if(S.seedFlag)return;
  if(S.doctors.size===0)seedMaster();
  else{S.seedOffer=true;renderNotices();}
}

/* ---------- boot ---------- */
function render(){renderTop();renderList();renderNotices();renderProfile();}
$('#q').addEventListener('input',e=>{S.q=e.target.value;S.limit=200;renderList();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet();});
render();
const use=n=>(window.claude&&window.claude.use)?window.claude.use(n).catch(()=>null):Promise.resolve(null);
use('db').then(db=>{S.db=db;S.dbChecked=true;if(db)subscribe();else{S.loaded.doctors=S.loaded.pharmacies=true;}render();});
use('sample').then(s=>{S.sample=s;if(!S.dirty)renderProfile();});
use('downloads').then(d=>{S.dl=d;renderTop();});
use('user').then(async u=>{try{if(u&&u.can){const c=await u.can('data.write');if(c===false){S.ro=true;render();}}}catch(e){}S.userChecked=true;checkSeed();});
</script>

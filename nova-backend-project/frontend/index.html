<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NOVA | نووآ - اتصال امن به بکند</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Vazirmatn', sans-serif; background: #f3f6fb; color: #0f172a; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <!-- Zero hardcoded usernames or passwords in frontend code -->
  <div class="w-full max-w-md bg-white border border-slate-200 rounded-3xl p-6 shadow-sm space-y-5">
    <div class="flex items-center justify-between">
      <div>
        <h1 class="text-lg font-extrabold text-blue-700">NOVA • نووآ</h1>
        <p class="text-xs text-slate-500">ورود امن از طریق سرور بکند و JWT</p>
      </div>
      <span id="apiStatus" class="text-[11px] font-bold px-2.5 py-1 rounded-full bg-amber-100 text-amber-800">در حال بررسی...</span>
    </div>

    <div>
      <label class="block text-xs font-bold mb-1 text-slate-600">آدرس سرور بکند (API URL)</label>
      <input id="apiBaseUrl" type="text" value="http://localhost:4000"
        class="w-full border border-slate-300 rounded-xl px-3 py-2 text-xs text-left" dir="ltr" />
    </div>

    <form id="loginForm" class="space-y-3">
      <input id="username" type="text" required placeholder="نام کاربری"
        class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm" />
      <input id="password" type="password" required placeholder="رمز عبور"
        class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm" />
      <input id="captchaInput" type="text" required placeholder="عبارت امنیتی"
        class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm" />

      <div class="flex items-center justify-between gap-2 pt-1">
        <button type="button" id="refreshCaptchaBtn"
          class="px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-xs font-bold cursor-pointer">
          تغییر کد
        </button>
        <span id="captchaCode" class="px-5 py-2 rounded-xl bg-slate-100 font-extrabold tracking-widest line-through text-sm">----</span>
      </div>

      <button type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-extrabold py-3 rounded-2xl text-sm cursor-pointer">
        ورود امن
      </button>
    </form>

    <div id="sessionPanel" class="hidden border-t border-slate-200 pt-4 space-y-3 text-xs">
      <div class="p-3 rounded-2xl bg-emerald-50 text-emerald-900 font-bold" id="userInfoBox"></div>
      <div class="flex gap-2">
        <button id="loadWorkspaceBtn" type="button"
          class="flex-1 bg-slate-900 text-white py-2.5 rounded-xl font-bold cursor-pointer">
          دریافت داده‌ها از بکند
        </button>
        <button id="logoutBtn" type="button"
          class="px-4 bg-rose-100 text-rose-700 py-2.5 rounded-xl font-bold cursor-pointer">
          خروج
        </button>
      </div>
      <pre id="workspacePreview" class="p-3 rounded-2xl bg-slate-900 text-emerald-300 text-[11px] overflow-x-auto" dir="ltr"></pre>
    </div>

    <p id="messageBox" class="text-xs font-bold text-center text-slate-600"></p>
  </div>

  <script>
    const TOKEN_KEY = 'nova_jwt_token_v1';
    const API_KEY = 'nova_api_base_url_v1';
    let captchaToken = '';

    const apiInput = document.getElementById('apiBaseUrl');
    apiInput.value = localStorage.getItem(API_KEY) || 'http://localhost:4000';

    function getApiUrl() {
      const val = apiInput.value.trim().replace(/\/+$/, '') || 'http://localhost:4000';
      localStorage.setItem(API_KEY, val);
      return val;
    }

    function setMsg(text, isError = false) {
      const el = document.getElementById('messageBox');
      el.textContent = text;
      el.className = `text-xs font-bold text-center ${isError ? 'text-rose-600' : 'text-emerald-700'}`;
    }

    async function loadCaptcha() {
      try {
        const res = await fetch(`${getApiUrl()}/api/auth/captcha`);
        const data = await res.json();
        if (data.ok) {
          document.getElementById('captchaCode').textContent = data.code;
          captchaToken = data.captchaToken;
          document.getElementById('apiStatus').textContent = 'متصل به بکند';
          document.getElementById('apiStatus').className = 'text-[11px] font-bold px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800';
        }
      } catch {
        document.getElementById('apiStatus').textContent = 'بکند در دسترس نیست';
        document.getElementById('apiStatus').className = 'text-[11px] font-bold px-2.5 py-1 rounded-full bg-rose-100 text-rose-800';
      }
    }

    async function checkSession() {
      const token = localStorage.getItem(TOKEN_KEY);
      if (!token) return;
      try {
        const res = await fetch(`${getApiUrl()}/api/auth/me`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        const data = await res.json();
        if (data.ok && data.user) {
          document.getElementById('loginForm').classList.add('hidden');
          document.getElementById('sessionPanel').classList.remove('hidden');
          document.getElementById('userInfoBox').textContent =
            `کاربر فعال: ${data.user.fullName} (${data.user.roleLabel})`;
        } else {
          localStorage.removeItem(TOKEN_KEY);
        }
      } catch {}
    }

    document.getElementById('refreshCaptchaBtn').addEventListener('click', loadCaptcha);

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      setMsg('در حال احراز هویت...');
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const captchaInput = document.getElementById('captchaInput').value.trim();

      try {
        const res = await fetch(`${getApiUrl()}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, captchaInput, captchaToken })
        });
        const data = await res.json();
        if (!data.ok) {
          setMsg(data.message || 'خطا در ورود', true);
          loadCaptcha();
          return;
        }
        localStorage.setItem(TOKEN_KEY, data.token);
        document.getElementById('password').value = '';
        document.getElementById('captchaInput').value = '';
        setMsg('ورود با موفقیت انجام شد.');
        await checkSession();
      } catch {
        setMsg('ارتباط با سرور بکند برقرار نشد.', true);
      }
    });

    document.getElementById('loadWorkspaceBtn').addEventListener('click', async () => {
      const token = localStorage.getItem(TOKEN_KEY);
      if (!token) return;
      try {
        const res = await fetch(`${getApiUrl()}/api/workspace/state`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        const data = await res.json();
        document.getElementById('workspacePreview').textContent = JSON.stringify(data, null, 2);
      } catch {
        setMsg('خطا در دریافت داده‌ها.', true);
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem(TOKEN_KEY);
      document.getElementById('sessionPanel').classList.add('hidden');
      document.getElementById('loginForm').classList.remove('hidden');
      document.getElementById('workspacePreview').textContent = '';
      setMsg('از حساب خارج شدید.');
      loadCaptcha();
    });

    loadCaptcha();
    checkSession();
  </script>
</body>
</html>
